backend:
  name: github
  repo: logisticsexplained/logistics-explained # Path to your GitHub repository
  branch: main


media_folder: "uploads"
public_folder: "/uploads"

editor:
  preview: false

collections:
  - name: "sponsors"
    label: "Sponsors Section"
    files:
      - file: "content/sponsors.json"
        label: "Sponsors Content"
        name: "sponsors"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Offer", name: "offer", widget: "text" }
          - { label: "Link", name: "link", widget: "string",
            hint: "URL to the sponsor's website" }
  - name: "job-support-circle"
    label: "Job Support Circle"
    files:
      - file: "content/job-support-circle.json"
        label: "Job Support Circle"
        name: "job-support-circle"
        fields:
          - { label: "Next call", name: "next_call", widget: "string", required: false,
            hint: "Shown as the main date above the buttons, e.g. 'Thursday 13 November, 7pm (UK)'. Leave blank to hide it." }
          - { label: "Zoom link", name: "zoom_link", widget: "string", required: false,
            hint: "Full Zoom meeting URL for the 'Join Zoom' button, e.g. https://us02web.zoom.us/j/123456789. Leave blank to hide the button." }
